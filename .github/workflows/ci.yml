name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build mod
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build src/Mother.csproj -c Release

      - name: Assemble mod folder
        shell: pwsh
        run: |
          $out = "artifact/motherscug"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item mod/* $out -Recurse
          $plugins = "$out/newest/plugins"
          if (Test-Path $plugins) { Remove-Item "$plugins/*.dll" }
          New-Item -ItemType Directory -Force $plugins | Out-Null
          Copy-Item src/bin/Release/net48/Mother.dll $plugins

      - uses: actions/upload-artifact@v4
        with:
          name: motherscug-${{ github.sha }}
          path: artifact

  prerelease:
    name: Publish test download
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: prerelease-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: motherscug-${{ github.sha }}
          path: artifact

      - name: Replace the branch's pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          safe="${BRANCH//\//-}"
          tag="build-$safe"
          short="${GITHUB_SHA::7}"
          zip_name="motherscug-$safe-$short.zip"
          (cd artifact && zip -qr "../$zip_name" motherscug)
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create "$tag" "$zip_name" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Test build: $BRANCH ($short)" \
            --notes "Automatic test build of $BRANCH at $GITHUB_SHA. Unzip and drop the motherscug folder into Rain World's mods folder. Replaced on every push to this branch."

  validate-json:
    name: Validate JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse every JSON file under mod/
        shell: python
        run: |
          import glob, json, sys
          files = glob.glob("mod/**/*.json", recursive=True)
          failed = 0
          for f in files:
              try:
                  with open(f, encoding="utf-8-sig") as fh:
                      json.load(fh)
              except Exception as e:
                  failed += 1
                  print(f"::error file={f}::{e}")
          print(f"Checked {len(files)} files, {failed} invalid")
          sys.exit(1 if failed else 0)
